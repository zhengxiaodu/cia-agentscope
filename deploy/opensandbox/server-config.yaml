apiVersion: v1
kind: ConfigMap
metadata:
  name: opensandbox-server-config
  namespace: opensandbox-system
data:
  config.toml: |
    [server]
    host = "0.0.0.0"
    port = 80
    api_key = ""  # 实际由环境变量 OPENSANDBOX_SERVER_API_KEY 覆盖

    [log]
    level = "INFO"

    [runtime]
    type = "kubernetes"
    execd_image = "sandbox-registry.cn-zhangjiakou.cr.aliyuncs.com/opensandbox/execd:v1.0.21"

    [kubernetes]
    kubeconfig_path = ""
    namespace = "opensandbox"
    informer_enabled = true
    informer_resync_seconds = 300
    informer_watch_timeout_seconds = 60
    snapshot_create_timeout_seconds = 900
    workload_provider = "batchsandbox"
    batchsandbox_template_file = "/etc/opensandbox/example.batchsandbox-template.yaml"

    [egress]
    image = "sandbox-registry.cn-zhangjiakou.cr.aliyuncs.com/opensandbox/egress:v1.1.5"
    mode = "dns+nft"

    [ingress]
    mode = "gateway"
    gateway.address = ""  # 部署后由 Service ClusterIP 自动填充
    gateway.route.mode = "header"
