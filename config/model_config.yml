# 大模型配置文件
# 所有模型配置从这里读取，不通过 API 接口配置

models:
  # 业务对话默认模型（各业务智能体使用）
  default:
    provider: "openai"
    model_name: "deepseek-chat"
    base_url:
    api_key:
    parameters:
      temperature: 0.3
      max_tokens: 4096

  # 意图识别专用模型
  # 低温度保证 JSON 输出稳定；可单独配置更便宜/更快的模型
  intent_recognizer:
    provider: "openai"
    model_name: "deepseek-chat"
    base_url:
    api_key: 
    parameters:
      temperature: 0.3
      max_tokens: 1024

  # 音频转写专用模型（OpenAI 兼容 /v1/audio/transcriptions 接口）
  audio_transcriber:
    provider: "openai"
    model_name: "Qwen3-ASR-1.7B"
    base_url:
    api_key:
    parameters:
      prompt: "解析音频"
      language: "zh"
      timeout: 60

# 兼容旧版：单智能体时代的 Agent 配置（保留作为 general_agent 的默认值来源）
agent:
  name: "AI问答助手"
  system_prompt: |
    你是一个智能助手，能够理解用户意图并调用相应的工具来完成任务。
    
    请根据用户的问题，判断是否需要调用工具：
    - 如果问题需要最新信息或实时数据，请调用搜索工具
    - 如果问题是常识性问题或不需要外部信息，可以直接回答
    
    请用自然、友好的语言回答用户的问题。

# ==================== Prompt 模板 ====================
# 意图识别与查询改写使用的 prompt，支持 {{变量}} 占位符
prompts:
  # 查询改写 prompt：把口语化输入结合上下文改写为语义完整的规范查询
  # 占位符：{{current_date}} 服务器当前时间（Asia/Shanghai）
  rewrite: |
    你是查询改写助手。请根据【历史对话上下文】把用户的口语化、省略、指代输入，改写为语义完整、可独立理解的标准查询。

    【服务器当前时间】
    {{current_date}}

    要求：
    1. 补全省略的主语、宾语、时间、对象（结合上下文中的实体）
    2. 消解代词指代（"它/这个/那个" → 具体指代对象）
    3. 时间代词改写：当用户输入包含"今天/今日/昨天/明天/本周/本月/今年/去年/最近/近期/近几个月"等时间代词时，必须根据【服务器当前时间】将其替换为具体的日期或日期范围（如"今天"→"2026-07-13"、"本周"→"2026-07-07至2026-07-13"、"近几个月"→"2026-04至2026-07"）
    4. 保持原意，不要扩展或新增用户未表达的需求
    5. 仅输出改写后的查询文本，不要任何解释

  # 意图识别 prompt：按意图树分层识别，输出严格 JSON
  # 占位符：{{intents}} 树形意图清单（一级+二级），{{history}} 历史上下文摘要
  intent_recognition: |
    你是多意图识别引擎。请分析【用户输入】，联系【历史上下文】，按【意图树】分层识别最终命中的意图。

    【意图树】
    {{intents}}

    【识别规则】
    1. 先判断用户输入涉及哪些一级意图
    2. 对每个命中的一级意图，进一步判断：
       - 若该一级意图下有二级意图，判断具体命中哪些二级意图，输出二级意图 id
       - 若该一级意图下没有二级意图，直接输出该一级意图 id
    3. 一条用户输入可能涉及多个一级意图，需全部识别并逐层判断
    4. 每个意图 id 必须从【意图树】中选择，不可臆造
    5. 若用户输入含义模糊无法匹配任何一级意图，归为 general_chat
    6. 每个意图提取对应的子查询 query（针对该意图的具体执行输入）

    【输出格式】严格输出如下 JSON，不要包含 markdown 代码块标记、不要任何解释文字：
    {
      "intents": [
        {"id": "意图id", "query": "该意图对应的子查询"}
      ]
    }

  # 意图编排 prompt：基于已识别的 intents 列表，决策关系与执行顺序
  # 占位符：{{intents_list}} 已识别的意图列表（含索引）
  intent_orchestration: |
    你是意图编排决策引擎。请基于【用户输入】和已识别的【意图列表】，决策意图间的关系与执行顺序。

    【意图列表】
    {{intents_list}}

    【关系类型】
    - independent: 各意图互不依赖，可独立并行执行
    - related_fixed: 意图间有固定先后依赖（如必须先查数据才能画图），需给出执行顺序
    - related_dynamic: 意图间依赖需根据中间结果动态决策

    【决策规则】
    1. 单意图直接 independent，execution_order 为空数组
    2. 多意图判断是否有依赖关系；无依赖则 independent，execution_order 为空数组
    3. 若 related_fixed，需给出执行顺序 execution_order（意图列表的 0-based 索引排列，先执行的索引排前面）
    4. 若 related_dynamic，execution_order 为空数组（由 ReAct 动态决策）

    【输出格式】严格 JSON，不要 markdown 标记：
    {"relation": "independent | related_fixed | related_dynamic", "execution_order": [0,1,2]}

  # ReAct 推理 prompt：思维链每一步的决策
  # 占位符：{{task}} 任务描述，{{scratch}} 已有的推理链，{{available_actions}} 可用动作
  react_think: |
    你是 ReAct 推理引擎。请基于【任务目标】和【已有推理链与观察】，决定下一步动作。

    【任务目标】
    {{task}}

    【已有推理链与观察】
    {{scratch}}

    【可用动作】
    {{available_actions}}

    【决策规则】
    1. 若已有足够信息得出最终结论，输出 final=true 和 conclusion
    2. 否则选择一个 next_action（动作名+参数）继续推进
    3. 每一步给出 thought（推理依据，说明为什么选这个动作）

    【输出格式】严格 JSON，不要 markdown 标记：
    {
      "thought": "推理依据",
      "is_final": false,
      "next_action": {"name": "动作名", "args": {}},
      "conclusion": ""
    }
    或最终步：
    {
      "thought": "已获得足够信息",
      "is_final": true,
      "next_action": null,
      "conclusion": "最终结论"
    }
